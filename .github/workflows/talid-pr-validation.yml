name: TALID pull request validation

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate browser JavaScript
        run: |
          node --check web/app.js
          node --check web/config.js || test ! -f web/config.js
          node --check web/config.example.js

      - name: Ensure secrets are not in browser files
        run: |
          if grep -RniE 'service_role|SUPABASE_SERVICE_ROLE_KEY|EASYORDERS_API_KEY' web; then
            echo "Server-side secrets must never be stored in browser files."
            exit 1
          fi

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/easyorders-catalog-sync/index.ts
          deno check supabase/functions/easyorders-webhook/index.ts
          deno check supabase/functions/talid-control/index.ts
          deno check supabase/functions/talid-worker/index.ts
          deno check supabase/functions/integration-gateway/index.ts
