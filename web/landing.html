<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1f44"><title>TALID | عرض المنتج</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#14213d;font-family:Tahoma,Arial,sans-serif;line-height:1.8}
.wrap{max-width:920px;margin:auto;padding:20px}.brand{background:#0b1f44;color:#e7bd36;padding:16px 22px;font-weight:bold;letter-spacing:2px}
.hero{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #14213d12;margin:24px 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;padding:12px}.gallery img{width:100%;height:270px;object-fit:contain;background:#f7f7f5;border-radius:14px}
.content{padding:clamp(20px,5vw,42px)}h1{font-size:clamp(26px,5vw,42px);line-height:1.35;margin:0 0 12px}.sub{color:#8a6b00;font-size:19px}.body{white-space:pre-wrap;color:#4b5563;font-size:17px}
.price{font-size:32px;font-weight:bold;color:#0b1f44;margin:20px 0}.buy{display:inline-block;background:#d9ae20;color:#10213e;padding:14px 34px;border-radius:999px;text-decoration:none;font-weight:bold}
footer{text-align:center;color:#7b8494;padding:25px;font-size:13px}.hidden{display:none}
</style>
</head>
<body>
<div class="brand">TALID • HERITAGE • AMBITION • INNOVATION</div>
<main class="wrap"><div id="state" class="hero content">جارٍ تحميل صفحة المنتج...</div><article id="page" class="hero hidden">
<div id="gallery" class="gallery"></div><section class="content">
<h1 id="headline"></h1><div id="subheadline" class="sub"></div>
<div id="body" class="body"></div><div id="price" class="price"></div>
<a id="order" class="buy" href="#" rel="nofollow">اطلب الآن</a>
</section></article></main>
<footer>© TALID — تجربة تسوق واضحة وآمنة</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="landing.js"></script>
</body></html>
